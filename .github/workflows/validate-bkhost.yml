name: Validate BioBilingual BKHost JSX
on:
  push:
    paths:
      - 'bkhost/**'
      - '.github/workflows/validate-bkhost.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install JSX parser
        run: npm install --no-save --no-package-lock @babel/parser@7
      - name: Validate student and admin React scripts
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const parser = require('@babel/parser');
          for(const name of ['bkhost/index.html','bkhost/admin/index.html']){
            const html = fs.readFileSync(name, 'utf8');
            const source=[...html.matchAll(/<script\s+type="text\/babel"[^>]*>([\s\S]*?)<\/script>/g)];
            if(source.length<1)throw Error(name+' missing React script');
            for(const [i,match] of source.entries()){
              try {const ast=parser.parse(match[1],{sourceType:'script',plugins:['jsx']});console.log(name,'JSX script',i+1,'parse OK; statements:',ast.program.body.length);}
              catch(error){console.error('JSX parse FAILED in',name,'script',i+1,error.message);process.exitCode=1;}
            }
          }
          NODE
