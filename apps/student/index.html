<body>
<div id="bio-loading">Đang tải BioBilingual…</div>
<script>
(async()=>{
  const loading=document.getElementById('bio-loading');
  try{
    const stable='https://raw.githubusercontent.com/biobilingual/sinh-hoc-hoc-duong/7cbba63bd9959d3a3acdf1448a9c3caaf6e6720a/apps/student/index.html';
    const response=await fetch(stable,{cache:'no-store'});
    if(!response.ok)throw new Error('Không tải được giao diện học sinh.');
    let html=await response.text();
    const sourcePatches=[[", example:'Carbon is an essential macronutrient in living organisms.', exampleVi:'Carbon là một nguyên tố đa lượng thiết yếu ở cơ thể sống.'","",1],[", example:'Zinc is a trace element needed by many enzymes.', exampleVi:'Kẽm là nguyên tố vi lượng cần cho nhiều enzyme.'","",1],[", example:'Water polarity allows it to dissolve many substances.', exampleVi:'Tính phân cực của nước giúp nước hòa tan nhiều chất.'","",1],[", example:'Water acts as a biological solvent in cells.', exampleVi:'Nước hoạt động như một dung môi sinh học trong tế bào.'","",1],[", example:'Glucose is a common monosaccharide.', exampleVi:'Glucose là một loại đường đơn phổ biến.'","",1],[", example:'Lipids store energy and form cell membranes.', exampleVi:'Lipid dự trữ năng lượng và tạo nên màng tế bào.'","",1],[", example:'A bacterial cell is a prokaryotic cell.', exampleVi:'Tế bào vi khuẩn là một tế bào nhân sơ.'","",1],[", example:'The cell wall helps protect plant cells.', exampleVi:'Thành tế bào giúp bảo vệ tế bào thực vật.'","",1],[", example:'The cell membrane controls what enters the cell.', exampleVi:'Màng sinh chất kiểm soát các chất đi vào tế bào.'","",1],[", example:'Osmosis is the movement of water across a membrane.', exampleVi:'Thẩm thấu là sự di chuyển của nước qua màng.'","",1],[", example:'Oxygen enters cells by passive diffusion.', exampleVi:'Oxy đi vào tế bào nhờ khuếch tán thụ động.'","",1],[", example:'Active transport requires energy from ATP.', exampleVi:'Vận chuyển chủ động cần năng lượng từ ATP.'","",1],[", example:`${word.term} is an important biology term.`, exampleVi:word.def || `${word.term} là một thuật ngữ sinh học quan trọng.`","",1],["vi:word.def||word.meaning||base.exampleVi","vi:word.def||word.meaning||base.meaning||''",1],["grid-cols-[1.6fr_1fr_0.65fr_1.35fr_0.45fr]","grid-cols-[1.6fr_1.4fr_0.8fr_0.45fr]",2],["            <div>LOẠI TỪ</div>\n            <div>VÍ DỤ</div>\n            <div className=\"text-center\">THUỘC</div>","            <div>LOẠI TỪ</div>\n            <div className=\"text-center\">THUỘC</div>",1],["                  <div>\n                    <div className=\"md:hidden text-xs font-bold text-slate-400 mb-1\">VÍ DỤ</div>\n                    <p className=\"text-slate-500 leading-relaxed line-clamp-3\">Ví dụ: “{w.term}” là một khái niệm cần ghi nhớ trong {selectedLesson.toLowerCase()}.</p>\n                  </div>\n\n","",1],["<p className=\"mt-5 text-slate-500\"><strong>Ví dụ / Example:</strong> {info.example} — {info.exampleVi}</p>","",1],["bg-blue-600 text-white px-6 py-2 rounded-lg","bg-blue-600 text-white px-8 py-4 rounded-xl text-lg font-extrabold shadow-md hover:bg-blue-700 transition",1],["mb-1 text-xs font-bold text-blue-100 hover:text-white","mb-2 inline-flex items-center rounded-xl bg-white/20 px-4 py-2.5 text-sm font-extrabold text-blue-50 hover:bg-white/30 hover:text-white transition",1],["mb-1 text-xs font-bold text-cyan-100 hover:text-white","mb-2 inline-flex items-center rounded-xl bg-white/20 px-4 py-2.5 text-sm font-extrabold text-cyan-50 hover:bg-white/30 hover:text-white transition",1],["inline-flex items-center gap-2 text-sm font-semibold text-slate-500 hover:text-blue-700","inline-flex items-center gap-2 rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-base font-extrabold text-slate-600 shadow-sm hover:border-blue-300 hover:bg-blue-50 hover:text-blue-700",1],["  { id:'tl-2', group:'Trả lời ngắn', kind:'short', prompt:'Nêu vai trò chính của ADN trong tế bào.', keywords:['thông tin di truyền'], sample:'ADN lưu giữ, bảo quản và truyền đạt thông tin di truyền; đồng thời làm khuôn cho quá trình tổng hợp protein.' }\n];","  { id:'tl-2', group:'Trả lời ngắn', kind:'short', prompt:'Nêu vai trò chính của ADN trong tế bào.', keywords:['thông tin di truyền'], sample:'ADN lưu giữ, bảo quản và truyền đạt thông tin di truyền; đồng thời làm khuôn cho quá trình tổng hợp protein.' },\n  { id:'ds-3', group:'Đúng/Sai', kind:'tf', prompt:'Đánh dấu Đúng hoặc Sai về cấu trúc và hoạt động của tế bào.', statements:[\n    { text:'Phần lớn tế bào nhân thực có nhân được bao bọc bởi màng nhân.', answer:true, explanation:'Đúng. Nhân của phần lớn tế bào nhân thực được bao bọc bởi màng nhân.' },\n    { text:'Thành tế bào thực vật chủ yếu được cấu tạo từ cellulose.', answer:true, explanation:'Đúng. Cellulose là thành phần chủ yếu của thành tế bào thực vật.' },\n    { text:'Khuếch tán luôn đưa chất từ nơi có nồng độ thấp đến nơi có nồng độ cao và cần ATP.', answer:false, explanation:'Sai. Khuếch tán thụ động diễn ra theo chiều gradien nồng độ và không cần ATP.' },\n    { text:'Trong quang hợp, năng lượng ánh sáng được chuyển thành năng lượng hóa học.', answer:true, explanation:'Đúng. Quang hợp chuyển năng lượng ánh sáng thành năng lượng hóa học dự trữ trong chất hữu cơ.' }\n  ]},\n  { id:'ds-4', group:'Đúng/Sai', kind:'tf', prompt:'Đánh dấu Đúng hoặc Sai về các cấp độ tổ chức của thế giới sống.', statements:[\n    { text:'Quần thể gồm các cá thể cùng loài sống trong một khu vực xác định.', answer:true, explanation:'Đúng. Đây là đặc trưng cơ bản của một quần thể.' },\n    { text:'Quần xã gồm các quần thể của nhiều loài cùng sống và tương tác trong một khu vực.', answer:true, explanation:'Đúng. Quần xã gồm nhiều quần thể thuộc các loài khác nhau.' },\n    { text:'Hệ sinh thái chỉ gồm sinh vật, không bao gồm môi trường vô sinh.', answer:false, explanation:'Sai. Hệ sinh thái gồm quần xã sinh vật và môi trường sống của chúng.' },\n    { text:'Sinh quyển bao gồm toàn bộ các hệ sinh thái trên Trái Đất.', answer:true, explanation:'Đúng. Sinh quyển là cấp tổ chức lớn nhất của thế giới sống.' }\n  ]},\n  { id:'ds-5', group:'Đúng/Sai', kind:'tf', prompt:'Đánh dấu Đúng hoặc Sai về các hợp chất hữu cơ trong tế bào.', statements:[\n    { text:'Phân tử nước có tính phân cực.', answer:true, explanation:'Đúng. Phân bố điện tích không đều làm phân tử nước có tính phân cực.' },\n    { text:'Lipid thường tan tốt trong nước.', answer:false, explanation:'Sai. Phần lớn lipid kị nước và không tan tốt trong nước.' },\n    { text:'Protein được cấu tạo từ các amino acid.', answer:true, explanation:'Đúng. Amino acid là đơn phân cấu tạo nên protein.' },\n    { text:'Carbohydrate chỉ có chức năng dự trữ năng lượng, không tham gia cấu trúc.', answer:false, explanation:'Sai. Một số carbohydrate còn có chức năng cấu trúc, chẳng hạn cellulose.' }\n  ]},\n  { id:'tl-3', group:'Trả lời ngắn', kind:'short', prompt:'Tính thấm chọn lọc của màng sinh chất giúp ích gì cho tế bào?', keywords:['kiểm soát trao đổi chất'], sample:'Tính thấm chọn lọc giúp tế bào kiểm soát trao đổi chất giữa tế bào và môi trường.' },\n  { id:'tl-4', group:'Trả lời ngắn', kind:'short', prompt:'Bào quan nào là nơi diễn ra phần lớn quá trình hô hấp tế bào ở tế bào nhân thực?', keywords:['ty thể'], sample:'Ty thể là nơi diễn ra phần lớn quá trình hô hấp tế bào và tạo ATP.' },\n  { id:'tl-5', group:'Trả lời ngắn', kind:'short', prompt:'Nêu vai trò chính của ribosome.', keywords:['tổng hợp protein'], sample:'Ribosome là nơi tổng hợp protein trong tế bào.' }\n];",1],["const uploadedBundles = uploadedExamQuestions.filter(item => Array.isArray(item.questions) && item.questions.length === 14);","const uploadedBundles = uploadedExamQuestions.filter(item => Array.isArray(item.questions) && (item.questions.length === 20 || item.questions.length === 14));",1],["setExam([...pick('choice',10), ...pick('tf',2), ...pick('short',2)]);","setExam([...pick('choice',10), ...pick('tf',5), ...pick('short',5)]);",1],["const tags = [{label:'Trắc nghiệm 4 đáp án', count:10, tone:'bg-blue-50 text-blue-700 border-blue-100'}, {label:'Đúng/Sai', count:2, tone:'bg-emerald-50 text-emerald-700 border-emerald-100'}, {label:'Trả lời ngắn', count:2, tone:'bg-sky-50 text-sky-700 border-sky-100'}];","const tags = [{label:'Trắc nghiệm 4 đáp án', count:10, tone:'bg-blue-50 text-blue-700 border-blue-100'}, {label:'Đúng/Sai', count:5, tone:'bg-emerald-50 text-emerald-700 border-emerald-100'}, {label:'Trả lời ngắn', count:5, tone:'bg-sky-50 text-sky-700 border-sky-100'}];",1],["Luyện tập theo cấu trúc 10–2–2","Luyện tập theo cấu trúc 10–5–5",1],["Mỗi đề gồm 10 câu trắc nghiệm 4 đáp án, 2 câu đúng/sai và 2 câu trả lời ngắn.","Mỗi đề gồm 10 câu trắc nghiệm 4 đáp án, 5 câu đúng/sai và 5 câu trả lời ngắn.",1]];
    for(const [before,after,expected] of sourcePatches){const actual=html.split(before).length-1;if(actual!==expected)throw new Error('Could not patch the student app.');html=html.split(before).join(after);}
    const worksheetPlayerTarget = "const ExternalWorksheetPlayer = ({ item, onExit }) => {\n  const src = item.worksheetUrl || item.source || '';";
    const worksheetPlayerFallback = [
      "const ExternalWorksheetPlayer = ({ item, onExit }) => {",
      "  const rawSrc = item.worksheetUrl || item.source || '';",
      "  const isGithubStatusEmbed = /(?:githubstatus|github[./:_-]status|(?:x\\.com|twitter\\.com|platform\\.twitter\\.com))/i.test(rawSrc);",
      "  const isLevelsOfOrganizationWorksheet = /levels? of organization|các cấp độ tổ chức|thế giới sống/i.test(item.title || '');",
      "  if (isGithubStatusEmbed && isLevelsOfOrganizationWorksheet) {",
      "    const worksheet = { ...worksheetTemplate, ...(item.worksheet && typeof item.worksheet === 'object' ? item.worksheet : {}), title: item.title || item.worksheet?.title || worksheetTemplate.title };",
      "    return <WorksheetPlayer item={{ ...item, worksheet }} onExit={onExit} />;",
      "  }",
      "  const src = rawSrc;"
    ].join('\n');
    if (!html.includes(worksheetPlayerTarget)) throw new Error('Could not patch the worksheet player.');
    html = html.replace(worksheetPlayerTarget, worksheetPlayerFallback);
    const historyScript='<script src="https://biobilingual.github.io/sinh-hoc-hoc-duong/apps/student/history.js?v=20261002-1108"><\/script>';
    if(html.includes('</body>')) html=html.replace('</body>',historyScript+'</body>');
    else html+=historyScript;
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    loading.textContent='Không thể tải BioBilingual: '+(error?.message||error);
    loading.style.color='#be123c';
  }
})();
</script>
</body>
</html>
