<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BioBilingual Admin</title>
<style>body{font-family:Arial,sans-serif;margin:0;background:#f8fafc;color:#334155;min-height:100vh;display:grid;place-items:center}#boot{font-weight:700}</style>
</head>
<body>
<div id="boot">Đang tải BioBilingual Admin…</div>
<script>
(async()=>{
  try{
    const url='https://raw.githubusercontent.com/biobilingual/sinh-hoc-hoc-duong/07eb9f4625a8ef43bb6733bd97c78660686c8c73/apps/admin/index.html';
    const res=await fetch(url,{cache:'no-store'});
    if(!res.ok)throw new Error('Không tải được giao diện Admin.');
    let html=await res.text();
    const sourcePatches=[["const worksheetSample={","const adminDownloadWorkbook=(filename,headers,rows=[])=>{const book=XLSX.utils.book_new();const sheet=XLSX.utils.aoa_to_sheet([headers,...rows]);XLSX.utils.book_append_sheet(book,sheet,'Mẫu');XLSX.writeFile(book,filename)};\nconst worksheetSample={",1],["counts.choice!==10||counts.tf!==2||counts.short!==2","counts.choice!==10||counts.tf!==5||counts.short!==5",1],["Cần đúng 10–2–2.","Cần đúng 10–5–5.",1],["preview.length!==14","preview.length!==20",3],["preview.length===14","preview.length===20",1],["questionCount:14","questionCount:20",2],["counts:{choice:10,tf:2,short:2}","counts:{choice:10,tf:5,short:5}",1],["Chọn file Excel hợp lệ theo đúng mẫu 10–2–2.","Chọn file Excel hợp lệ theo đúng mẫu 10–5–5.",1],["Tải một file, tạo ngay đề 14 câu","Tải một file, tạo ngay đề 20 câu",1],["10 câu trắc nghiệm 4 đáp án, 2 câu đúng/sai và 2 câu trả lời ngắn.","10 câu trắc nghiệm 4 đáp án, 5 câu đúng/sai và 5 câu trả lời ngắn.",1],["Hệ thống tự đọc và kiểm tra đủ 10–2–2 câu","Hệ thống tự đọc và kiểm tra đủ 10–5–5 câu",1],["10 trắc nghiệm · 2 đúng/sai · 2 trả lời ngắn","10 trắc nghiệm · 5 đúng/sai · 5 trả lời ngắn",1],["<div className=\"rounded-2xl bg-emerald-50 p-4\"><b className=\"text-2xl text-emerald-700\">2</b>","<div className=\"rounded-2xl bg-emerald-50 p-4\"><b className=\"text-2xl text-emerald-700\">5</b>",1],["<div className=\"rounded-2xl bg-sky-50 p-4\"><b className=\"text-2xl text-sky-700\">2</b>","<div className=\"rounded-2xl bg-sky-50 p-4\"><b className=\"text-2xl text-sky-700\">5</b>",1],["<a href=\"/templates/mau-de-thi-biobilingual.xlsx\" download className=\"shrink-0 rounded-2xl bg-white px-5 py-3 text-sm font-black text-orange-600 shadow-lg\">↓ Tải file Excel mẫu</a>","<button type=\"button\" onClick={()=>adminDownloadWorkbook('mau-de-thi-biobilingual.xlsx',['Loại câu hỏi','Nội dung câu hỏi','Đáp án A','Đáp án B','Đáp án C','Đáp án D','Đáp án đúng','Lời giải','Mệnh đề a','Đáp án a','Giải thích a','Mệnh đề b','Đáp án b','Giải thích b','Mệnh đề c','Đáp án c','Giải thích c','Mệnh đề d','Đáp án d','Giải thích d','Từ khóa chấm','Đáp án mẫu'],[...Array.from({length:10},()=>['Trắc nghiệm 4 đáp án']),...Array.from({length:5},()=>['Đúng/Sai']),...Array.from({length:5},()=>['Trả lời ngắn'])])} className=\"shrink-0 rounded-2xl bg-white px-5 py-3 text-sm font-black text-orange-600 shadow-lg hover:bg-orange-50\">↓ Tải file Excel mẫu · 20 câu</button>",1],["<a href=\"/templates/mau-tu-vung-biobilingual.xlsx\" download className=\"inline-flex shrink-0 items-center justify-center rounded-xl bg-violet-600 px-4 py-3 text-sm font-black text-white shadow-lg shadow-violet-200 hover:bg-violet-700\">↓ Tải file XLSX mẫu</a>","<button type=\"button\" onClick={()=>adminDownloadWorkbook('mau-tu-vung-biobilingual.xlsx',['Từ vựng','Phiên âm','Nghĩa tiếng Việt','Từ loại','Hình ảnh'])} className=\"inline-flex shrink-0 items-center justify-center rounded-xl bg-violet-600 px-4 py-3 text-sm font-black text-white shadow-lg shadow-violet-200 hover:bg-violet-700\">↓ Tải file XLSX mẫu · 5 cột</button>",1]];
    for(const [before,after,expected] of sourcePatches){const actual=html.split(before).length-1;if(actual!==expected)throw new Error('Could not patch the admin app.');html=html.split(before).join(after);}
    html=html.replace('</body>','<script src="./student-reset.js"><\/script></body>');
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    const el=document.getElementById('boot');
    el.textContent='Không thể tải Admin: '+(err?.message||err);
    el.style.color='#be123c';
  }
})();
</script>
</body>
</html>
